<title>Speedbådsprøven – Eksamenstræner</title>

<style>
:root{--navy:#0b2540;--sea:#13406b;--foam:#eef4f9;--ink:#0b1b2b;--muted:#5b6b7b;--ok:#1f8a4c;--bad:#c62828;--line:#d7e2ec;--accent:#f2b705}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;background:var(--foam);color:var(--ink)}
header{background:linear-gradient(135deg,var(--navy),var(--sea));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 0}
header h1{margin:0 0 2px;font-size:21px}
header p{margin:0 0 12px;opacity:.8;font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#cfe0ef;padding:10px 14px;font:600 14px Inter,sans-serif;border-radius:10px 10px 0 0;cursor:pointer}
nav button.on{background:var(--foam);color:var(--navy)}
main{max-width:1000px;margin:0 auto;padding:20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.btn{background:var(--sea);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:600 14px Inter,sans-serif;cursor:pointer}
.btn.ghost{background:#e3edf6;color:var(--sea)}
.btn.warn{background:#b45309}
.btn:disabled{opacity:.4;cursor:default}
.pill{background:#e3edf6;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--sea);white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.q{display:grid;grid-template-columns:240px 1fr;gap:22px;align-items:center}
.q.noimg{grid-template-columns:1fr}
@media(max-width:680px){.q{grid-template-columns:1fr}}
.qtext{font-size:17px;font-weight:600;margin:0 0 14px;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:#f6f9fc;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font:500 15px Inter,sans-serif;cursor:pointer;color:var(--ink);line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--sea)}
.opt.sel{border-color:var(--sea);background:#e6f0f9}
.opt.ok{border-color:var(--ok);background:#e6f5ec}
.opt.bad{border-color:var(--bad);background:#fdecec}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.5}
.fb.ok{background:#e6f5ec}.fb.bad{background:#fdecec}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:center}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.card .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.card .n{font-weight:600;font-size:14px;margin-top:2px;overflow-wrap:anywhere;hyphens:auto}.card .k{font-size:10px;overflow-wrap:normal;word-break:normal;hyphens:none}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.topic{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;font-family:Inter,sans-serif}
.topic:hover{border-color:var(--sea)}
.topic b{display:block;font-size:15px;margin-bottom:4px}
.topic span{font-size:13px;color:var(--muted)}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin-bottom:14px}
.qnav button{height:34px;border-radius:8px;border:2px solid var(--line);background:#fff;font:600 13px Inter,sans-serif;cursor:pointer;color:var(--ink);position:relative}
.qnav button.ans{background:#dbe8f4;border-color:#9dbbd8}
.qnav button.cur{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
.qnav button.flag::after{content:'';position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.timer{font-variant-numeric:tabular-nums}
.timer.low{background:#fdecec;color:var(--bad)}
.big{font-size:46px;font-weight:700}
.bar{height:8px;background:#e3edf6;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal .panel{max-width:420px}
.tip{background:#fff7d6;border-left:4px solid var(--accent);padding:10px 12px;border-radius:8px;margin-top:12px;font-size:14px}
.cheat h3{margin:18px 0 6px;font-size:16px;color:var(--sea)}
.cheat ul{margin:0;padding-left:20px;font-size:14px;line-height:1.6}
.night{background:radial-gradient(ellipse at 50% 30%,#14233a,#03070d);border-radius:14px;height:200px;position:relative;overflow:hidden}
.night .water{position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(#071223,#02060c)}
.lamp{position:absolute;left:50%;top:80px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#000}
dl{margin:0;display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px}dt{color:var(--muted);font-weight:600}dd{margin:0}
.review{display:flex;gap:14px;align-items:flex-start;font-size:14px;line-height:1.5}
.review svg{flex:none}
.small{font-size:13px;color:var(--muted)}

.fc-wrap{perspective:1200px;max-width:640px;margin:0 auto}
.fc{position:relative;min-height:380px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;overflow:auto;box-shadow:0 6px 20px rgba(11,37,64,.08)}
.fc-back{transform:rotateY(180deg);background:#f6fafd}
.fc-face .qtext{font-size:17px}
.fc-o{font-size:15px;padding:7px 0;border-bottom:1px solid #eef2f6}
.fc-img{text-align:center;margin-bottom:8px}.fc-img svg{max-height:180px;width:auto}
.fc-ans{font-size:17px;font-weight:700;color:var(--ok);margin:6px 0 10px}
.fc-ans span{display:block;margin-bottom:4px}
.fc-hint{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
.fc-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px;margin:14px auto 0}
.fc-btns .btn{padding:14px;font-size:15px}

@media(max-width:600px){header{padding:12px 12px 0}header h1{font-size:18px}header p{display:none}nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}nav button{white-space:nowrap;padding:9px 11px;font-size:13px}main{padding:12px}.panel{padding:14px}}
</style>
</head>

<header>
 <h1>🚤 Speedbådsprøven – Eksamenstræner</h1>
 <p>Den rigtige prøve: 2 × 15 min · Del 1 max 2 fejl · Del 2 max 3 fejl  ·  Dit træningsmål: kursets testeksamen (max 3 fejl, 0 i vigeregler og bøjer)</p>

 </nav>
</header>
<main id="app"></main>

<script>
// ================= UTIL =================
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const $=s=>document.querySelector(s);
const TOPICS={
 afm:{navn:'Afmærkning',ikon:'🛟',besk:'Bøjer: side-, kompas-, midtfarvands-, special- og fareafmærkning – 0 fejl tilladt i kursets test'},
 svr:{navn:'Søvejsregler',ikon:'⚖️',besk:'Regel 5–10 og 12–18, lydsignaler, tåge, lanterner'},

 man:{navn:'Manøvrer & knob',ikon:'⚓',besk:'Fortøjning, spring, ankring, bøje, bugsering, knob'}
};
const EXAMMIX={afm:6,svr:8,vig:4,sik:5,baad:4,nav:2,man:2}; // = 31
const EXMODES={
 kursus:{navn:'Kursets testeksamen (træningsmål)',n:38,min:40,max:3,zero:['vig','afm'],mix:{afm:9,vig:9,svr:6,sik:6,baad:4,nav:2,man:2},
  besk:'38 spørgsmål · højst 3 fejl · 0 fejl i vigeregler og bøjer. Strengere end den rigtige prøve – består du den, er du klar.'},
 officiel:{navn:'Den rigtige prøve (officiel)',n:31,min:30,partMin:15,max:99,zero:[],mix:{sik:6,baad:4,nav:3,man:2,afm:6,vig:6,svr:4},
  parts:[{navn:'Del 1 – Kendskab & forståelse',topics:['sik','baad','nav','man'],max:2},{navn:'Del 2 – Skal kunne (søvejsregler + afmærkning)',topics:['afm','vig','svr'],max:3}],
  besk:'To delprøver à 15 min: Del 1 højst 2 fejl, Del 2 højst 3 fejl – begge skal bestås. Som på Dansk Sejlunions hjemmeside.'}
};

// ================= QUESTION BANK =================
// [emne, spørgsmål, [rigtigt, forkert, forkert, forkert], forklaring]
const BANK=[
// ---------- SØVEJSREGLER ----------
['svr','Hvornår skal du holde udkig (regel 5)?',['Altid – ved syn og hørelse og med alle tilgængelige midler','Kun ved nedsat sigtbarhed','Kun når der er andre både i nærheden','Kun om natten'],'Regel 5: Der skal altid holdes forsvarligt udkig – også på en lille speedbåd i godt vejr.'],
['svr','Hvad er "sikker fart" (regel 6)?',['En fart, hvor du kan undgå kollision og stoppe inden for en passende afstand under de aktuelle forhold','Højst 8 knob','Den fart, båden er bygget til','Samme fart som trafikken omkring dig'],'Sikker fart afhænger af forholdene – der er ingen fast grænse i søvejsreglerne.'],
['svr','Hvilket forhold indgår IKKE i vurderingen af sikker fart?',['Hvor travlt du har','Sigtbarheden','Trafiktætheden','Vind, sø og strøm'],'Regel 6 nævner bl.a. sigtbarhed, trafiktæthed, manøvreevne, baggrundslys om natten, vind/sø/strøm og vanddybde.'],
['svr','Du pejler et skib, der nærmer sig, og pejlingen ændrer sig ikke mærkbart. Hvad betyder det?',['Der er fare for kollision','Skibet sejler væk fra dig','I passerer klar af hinanden','Skibet ligger stille'],'Regel 7: Konstant pejling + aftagende afstand = kollisionsfare.'],
['svr','Du er i tvivl om, hvorvidt der er fare for kollision. Hvad gør du?',['Går ud fra, at faren er til stede','Fortsætter uændret','Venter, til det er helt tydeligt','Øger farten for at komme forbi'],'Regel 7: Ved tvivl skal man antage, at der er kollisionsfare.'],
['svr','Hvordan skal en manøvre for at undgå kollision udføres (regel 8)?',['I god tid og så kraftig, at det andet skib tydeligt kan se den','Lille og gradvis, så du ikke forvirrer','Helst i sidste øjeblik','Kun ved at sætte farten ned'],'Regel 8: Tydelige, rettidige kurs- og/eller fartændringer – ikke en række små ændringer.'],
['svr','I et snævert løb – hvor skal du holde dig (regel 9)?',['Så nær løbets yderkant om styrbord, som det er sikkert','Midt i løbet','Ved yderkanten om bagbord','Der hvor der er dybest'],'Regel 9: Hold til styrbord i snævre løb.'],
['svr','Du sejler speedbåd i et snævert løb. Et stort skib, der kun kan navigere i løbet, kommer imod dig. Hvad gælder?',['Du må ikke hindre det store skibs passage','Det store skib skal vige for dig','Den, der kommer fra styrbord, viger','I skal begge dreje til bagbord'],'Regel 9: Fartøjer under 20 m må ikke hindre skibe, der kun kan navigere sikkert i løbet.'],
['svr','Må du ankre i et snævert løb?',['Nej, det skal så vidt muligt undgås','Ja, uden begrænsninger','Ja, hvis du viser ankerlys','Kun om dagen'],'Regel 9: Undgå at ankre i snævre løb.'],
['svr','Hvordan krydser du en trafikbane i et trafiksepareringssystem?',['Med kurs så vidt muligt vinkelret på trafikretningen','Skråt med trafikken','Langs separationszonen','Det er forbudt for fritidsbåde'],'Regel 10: Kryds i ret vinkel, så du er kortest tid i banen.'],
['svr','Hvad gælder for din speedbåd (under 20 m) i et trafiksepareringssystem?',['Du må ikke hindre sikker passage af maskindrevne skibe, der følger trafikbanen','Du har altid ret til at holde kurs','Du skal sejle i separationszonen','Du skal altid kalde trafikcentralen'],'Regel 10: Fartøjer under 20 m og sejlskibe må ikke hindre skibe, der følger banen.'],

['svr','Hvornår er du "overhalende"?',['Når du nærmer dig fra mere end 22,5° agten for det andet skibs tværs','Når du sejler hurtigere end den anden','Når du er mindre end 10 m bag den anden','Kun i snævre løb'],'Om natten svarer det til, at du kun kan se den andens hvide hæklanterne.'],

['svr','Hvem skal en motorbåd vige for ifølge regel 18?',['Manøvreudygtige, manøvrehæmmede (begrænset i manøvreevne), fiskende skibe, sejlskibe – og skibe til ankers','Kun sejlskibe','Kun skibe, der er større end den selv','Ingen – motorbåde har altid ret'],'Regel 18: Maskindrevet viger for alle fire typer.'],

['svr','To sejlbåde har vinden ind fra hver sin side. Hvem viger (regel 12)?',['Den med vinden ind om bagbord','Den med vinden ind om styrbord','Den største','Den hurtigste'],'Regel 12: Bagbords halse viger for styrbords halse.'],
['svr','To sejlbåde har vinden ind fra samme side. Hvem viger?',['Den, der er til luvart (mod vinden), viger for den i læ','Den i læ viger','Den forreste','Den mindste'],'Regel 12: Luvbåden viger.'],
['svr','Hvad betyder ÉN kort tone fra et skib, I kan se hinanden?',['Jeg drejer til styrbord','Jeg drejer til bagbord','Jeg bakker','Jeg er i tvivl om dine hensigter'],'Regel 34: 1 kort = styrbord, 2 korte = bagbord, 3 korte = bak.'],
['svr','Hvad betyder TO korte toner?',['Jeg drejer til bagbord','Jeg drejer til styrbord','Jeg bakker','Jeg er stoppet'],'Regel 34.'],
['svr','Hvad betyder TRE korte toner?',['Min maskine går bak','Jeg drejer til styrbord','Jeg ligger for anker','Jeg agter at overhale'],'Regel 34: Tre korte = jeg bakker.'],
['svr','Hvad betyder mindst FEM korte, hurtige toner?',['Jeg er i tvivl om dine hensigter – advarsel','Nødsignal','Jeg drejer til styrbord','Jeg ligger for anker'],'Kan suppleres med 5 korte, hurtige lysblink.'],
['svr','Hvor lang er en "kort tone"?',['Ca. 1 sekund','4–6 sekunder','10 sekunder','Et halvt minut'],'En lang tone er 4–6 sekunder.'],

['svr','Hvilket signal giver du, når du nærmer dig et sving i et løb, hvor andre kan være skjult?',['Én lang tone','Tre korte toner','To lange toner','Fem korte toner'],'Regel 34: Én lang tone ved sving/skjulte områder.'],

 else if(t.stripes){for(let i=0;i<6;i++)fill+=`<rect x="${30+i*10}" y="${top}" width="10.5" height="${h}" fill="${t.stripes[i%2]}"/>`}

 return `<svg viewBox="0 0 120 200" width="${o.w||150}" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="${id}"><path d="M42 ${top} L78 ${top} L88 ${bot} L32 ${bot} Z"/></clipPath></defs>

}

// ===== Kompas-scenarie (som i kursets "Jeg kommer sejlende på nordlig kurs...") =====
const HD={N:{n:'nordlig',a:0,dx:0,dy:-1},S:{n:'sydlig',a:180,dx:0,dy:1},E:{n:'østlig',a:90,dx:1,dy:0},W:{n:'vestlig',a:270,dx:-1,dy:0}};
const CDIR={nord:[0,-1],oest:[1,0],syd:[0,1],vest:[-1,0]};
function compassQ(H,KK){
 const h=H||pick(['N','S','E','W']),d=HD[h];
 const k=KK||((h==='N'||h==='S')?pick(['oest','vest']):pick(['nord','syd']));
 const [sx,sy]=CDIR[k];
 // cross product: is safe side to the right (styrbord) of heading?
 const right=(d.dx*sy-d.dy*sx)>0;
 const bx=150,by=140,ox=bx-d.dx*95,oy=by-d.dy*95,rx=bx-sx*55,ry=by-sy*55;
 const b=buoy(k,{w:30}).replace('<svg ',`<svg x="${bx-15}" y="${by-42}" height="50" `);
 const img=`<svg viewBox="0 0 300 280" width="240" xmlns="http://www.w3.org/2000/svg" style="background:#cfe3f3;border-radius:12px">
 <defs><marker id="ar2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#333"/></marker></defs>
 <g transform="translate(262,36)"><circle r="20" fill="#fff" stroke="#333"/><polygon points="0,-18 5,0 -5,0" fill="#c62828"/><polygon points="0,18 5,0 -5,0" fill="#333"/><text y="-23" text-anchor="middle" font-size="11" font-weight="700">N</text><text x="25" y="4" font-size="10">Ø</text><text x="-33" y="4" font-size="10">V</text><text y="32" text-anchor="middle" font-size="10">S</text></g>
 <ellipse cx="${rx}" cy="${ry}" rx="22" ry="13" fill="#555"/><text x="${rx}" y="${ry+26}" text-anchor="middle" font-size="10">sten</text>
 ${b}
 <g transform="translate(${ox},${oy}) rotate(${d.a})"><line x1="0" y1="-22" x2="0" y2="-50" stroke="#1565c0" stroke-width="3" marker-end="url(#ar2)"/><polygon points="0,-20 9,-5 9,16 -9,16 -9,-5" fill="#1565c0"/></g>
 <text x="${ox}" y="${oy+(d.dy>0?-28:34)}" text-anchor="middle" font-size="11" font-weight="600">DIG</text></svg>`;
 return mk('afm',`Du sejler på <b>${d.n}</b> kurs og ser denne bøje ret forude. Skal du dreje til styrbord eller bagbord?`,
  right?'Drej til styrbord':'Drej til bagbord',[right?'Drej til bagbord':'Drej til styrbord','Fortsæt ligeud – du kan passere på begge sider','Stop og læg dig for anker'],
  `Det er en ${T[k].navn.toLowerCase()} – passér ${RET[k].toLowerCase()} for den. På ${d.n} kurs ligger ${RET[k].toLowerCase()} til ${right?'styrbord (højre)':'bagbord (venstre)'}.`,{img,bk:k});
}

 isoleret:'en isoleret fareafmærkning, som der skal holdes afstand til',sikkert:'en midtfarvandsafmærkning, som kan passeres på begge sider',special:'en specialafmærkning, som markerer et område med restriktioner',nyfare:'en ny farekilde, som der skal holdes god afstand til'};

 else{let y=60;for(const[c,f]of t.bands){fill+=`<rect x="0" y="${y}" width="120" height="${100*f+.5}" fill="${c}"/>`;y+=100*f}}

 const pool=shuf([...Object.keys(PASSTXT).filter(x=>x!==k).map(x=>PASSTXT[x]),...WRONGPASS]).filter(x=>x!==c).slice(0,3);
 return mk('afm','Hvad er dette, og hvordan skal den passeres?',cap(c),pool.map(cap),`${T[k].navn}: ${T[k].pass} 💡 ${T[k].huske}`,{img:Math.random()<.6?symbol(k):buoy(k),bk:k})}

const fromBank=b=>Array.isArray(b[2])?mk(b[0],b[1],b[2][0],b[2].slice(1),b[3],{kurs:b[4]==='K'}):mkMulti(b[0],b[1],b[2].c,b[2].w,b[3],{kurs:b[4]==='K'});
const VIGRX=/vige|viger|vigepligt|overhal|indhent|kursholdende|stævn mod stævn|skærende kurs|vigerækkefølge|regel 1[2-8]|lanterne\. Hvad gælder|for anker\?|begrænset i sin manøvreevne/i;
BANK.forEach(b=>{if(b[0]==='svr'&&(VIGRX.test(b[1])||VIGRX.test(b[3]||'')))b[0]='vig'});
BANK.forEach(b=>{if(/tågesignal|Hvordan viser et fartøj/.test(b[1]))b[0]='svr'});
const STATIC=[...BANK,...AFMFACTS].filter(b=>b[0]!=='afmX');
function genTopic(topic,used,exam){
 if(topic==='svr'&&Math.random()<.2)return nightQ();
 if(topic==='vig'){const x=Math.random();if(x<.45)return vigQ()}
 if(topic==='afm'&&Math.random()<.75){const y=Math.random();if(y<.2)return compassQ();if(y<.45)return comboQ();const ks=Object.keys(BUOYGEN).filter(k=>!exam||(k!=='light'&&k!=='night'));return BUOYGEN[pick(ks)]()}
 let pool=STATIC.filter(b=>b[0]===topic&&!used.has(b[1]));if(exam==='kursus'&&Math.random()<.65){const kp=pool.filter(b=>b[4]==='K');if(kp.length)pool=kp}
 const b=pick(pool.length?pool:STATIC.filter(b=>b[0]===topic));used.add(b[1]);return fromBank(b);
}
function weightedTopic(){const ks=Object.keys(TOPICS);const w=ks.map(k=>{const L=level(k);return L.acc==null?2.2:Math.max(.4,1+(100-L.acc)/12)});let r=Math.random()*w.reduce((a,b)=>a+b);for(let i=0;i<ks.length;i++){r-=w[i];if(r<=0)return ks[i]}return ks[0]}
function buildExam(mode){const used=new Set(),qs=[],M=EXMODES[mode];for(const[t,n]of Object.entries(EXMODES[mode].mix))for(let i=0;i<n;i++){let q,tries=0;do{q=genTopic(t,used,mode==='kursus'?'kursus':true);tries++}while(tries<8&&qs.some(x=>x.q===q.q&&x.img===q.img));qs.push(q)}if(M.parts){const o=shuf(qs);return [...o.filter(q=>M.parts[0].topics.includes(q.topic)),...o.filter(q=>M.parts[1].topics.includes(q.topic))]}return shuf(qs)}

let stats={};try{stats=JSON.parse(localStorage.getItem('sbstats')||'{}')}catch(e){}
let history=[];try{history=JSON.parse(localStorage.getItem('sbhist')||'[]')}catch(e){}
function rec(q,ok){for(const k of [q.topic,q.bk?'b_'+q.bk:null].filter(Boolean)){const st=stats[k]=stats[k]||{r:0,f:0};ok?st.r++:st.f++;st.h=[...(st.h||[]),ok?1:0].slice(-20)}save()}
// Niveau: kræver et minimum af svar, og vurderer på de SENESTE svar (ikke alle nogensinde)
function level(k,need=10,win=10){const st=stats[k]||{r:0,f:0},n=st.r+st.f,h=(st.h||[]).slice(-win);
 if(!n)return{n,txt:'Ikke øvet endnu',cls:'none',p:0,acc:null};
 if(n<need)return{n,txt:`For få svar til en vurdering (${n}/${need})`,cls:'few',p:Math.round(n/need*100),acc:null};
 if(h.length<win)return{n,txt:`Samler dine seneste svar (${h.length}/${win})`,cls:'few',p:Math.round(h.length/win*100),acc:null};
 const acc=Math.round(h.reduce((a,b)=>a+b,0)/h.length*100);
 return acc>=90?{n,acc,p:acc,cls:'ok',txt:`Sikker – ${h.filter(Boolean).length}/${h.length} af de seneste rigtige`}:acc>=75?{n,acc,p:acc,cls:'mid',txt:`Næsten – ${h.filter(Boolean).length}/${h.length} af de seneste rigtige`}:{n,acc,p:acc,cls:'bad',txt:`Øv mere – ${h.filter(Boolean).length}/${h.length} af de seneste rigtige`}}
const LCLR={ok:'var(--ok)',mid:'var(--accent)',bad:'var(--bad)',few:'#9fb3c8',none:'#e3edf6'};
const lvlBar=L=>`<div class="bar"><i style="width:${L.cls==='none'?0:L.p}%;background:${LCLR[L.cls]}"></i></div><span class="small">${L.txt}</span>`;
function save(){try{localStorage.setItem('sbstats',JSON.stringify(stats));localStorage.setItem('sbhist',JSON.stringify(history))}catch(e){}}

let examState=null;
function exam(){
 if(examState&&!examState.done)return renderExam();
 app.innerHTML=`<h2 style="margin-top:0">📝 Prøveeksamen</h2><p class="small">Du kan gå frem og tilbage og markere spørgsmål. Svarene vises først, når du afleverer.</p><div class="topics">
 ${Object.entries(EXMODES).map(([k,m])=>`<button class="topic" data-m="${k}" ${k==='kursus'?'style="border-color:var(--accent)"':''}><b>${k==='kursus'?'⭐ ':''}${m.navn}</b><span>${m.besk}<br>Tid: ${m.partMin?'2 × '+m.partMin:m.min} min.</span></button>`).join('')}</div>`;
 app.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{const m=b.dataset.m,M=EXMODES[m];examState={mode:m,qs:buildExam(m),ans:Array(M.n).fill(null),flag:Array(M.n).fill(false),i:0,part:0,t0:Date.now(),end:Date.now()+(M.partMin||M.min)*60000,done:false};renderExam()});
}

 clearRun();const s=examState,q=s.qs[s.i],M=EXMODES[s.mode];
 let lo=0,hi=s.qs.length-1;const bnd=M.parts?s.qs.findIndex(x=>!M.parts[0].topics.includes(x.topic)):-1;
 if(M.parts){if(s.part)lo=bnd;else hi=bnd-1}
 const nextPart=()=>{clearRun();s.part=1;s.i=bnd;s.end=Date.now()+M.partMin*60000;renderExam()};
 const submitFn=M.parts&&!s.part?nextPart:finishExam;
 app.innerHTML=`<div class="row"><span class="pill">${M.navn}${M.parts?' · <b>'+(s.part?'Del 2':'Del 1')+'</b>':''} · ${s.i-lo+1} / ${hi-lo+1}</span><span class="pill" id="answered">Besvaret: ${s.ans.slice(lo,hi+1).filter(a=>a!==null).length}/${hi-lo+1}</span><span class="pill timer" id="timer"></span></div>
 <div class="qnav">${s.qs.map((_,i)=>i<lo||i>hi?'':`<button data-i="${i}" class="${s.ans[i]!==null?'ans':''} ${i===s.i?'cur':''} ${s.flag[i]?'flag':''}">${i-lo+1}</button>`).join('')}</div>
 <div class="panel">${qHTML(q,s.ans[s.i])}</div>
 <div class="row"><div style="display:flex;gap:8px"><button class="btn ghost" id="prev" ${s.i===lo?'disabled':''}>← Forrige</button><button class="btn ghost" id="flag">${s.flag[s.i]?'★ Fjern markering':'☆ Markér'}</button></div>
 <div style="display:flex;gap:8px"><button class="btn ghost" id="next" ${s.i===hi?'disabled':''}>Næste →</button><button class="btn" id="submit">${M.parts&&!s.part?'Aflever del 1 →':'Aflever'}</button></div></div>`;
 startNight(q);
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(q.multi){let a=Array.isArray(s.ans[s.i])?[...s.ans[s.i]]:[];a=a.includes(i)?a.filter(x=>x!==i):[...a,i];s.ans[s.i]=a.length?a:null;b.classList.toggle('sel',a.includes(i));b.querySelector('.chk').textContent=a.includes(i)?'☑':'☐';if(!a.length){app.querySelector(`.qnav button[data-i="${s.i}"]`).classList.remove('ans');$('#answered').textContent=`Besvaret: ${s.ans.slice(lo,hi+1).filter(a=>a!==null).length}/${hi-lo+1}`;return}}else{s.ans[s.i]=i;app.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b))}
  app.querySelector(`.qnav button[data-i="${s.i}"]`).classList.add('ans');$('#answered').textContent=`Besvaret: ${s.ans.slice(lo,hi+1).filter(a=>a!==null).length}/${hi-lo+1}`});
 app.querySelectorAll('.qnav button').forEach(b=>b.onclick=()=>{s.i=+b.dataset.i;renderExam()});
 $('#prev').onclick=()=>{s.i--;renderExam()};$('#next').onclick=()=>{s.i++;renderExam()};
 $('#flag').onclick=()=>{s.flag[s.i]=!s.flag[s.i];renderExam()};
 $('#submit').onclick=()=>{const un=s.ans.slice(lo,hi+1).filter(a=>a===null).length,fl=s.flag.slice(lo,hi+1).filter(Boolean).length;const p1=M.parts&&!s.part;

 const tick=()=>{const left=Math.max(0,s.end-Date.now()),m=Math.floor(left/60000),sec=Math.floor(left%60000/1000);const el=$('#timer');if(el){el.textContent=`⏱ ${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;el.classList.toggle('low',left<180000)}if(left<=0)submitFn()};
 tick();timerId=setInterval(tick,1000);
}
function finishExam(){
 clearRun();const s=examState;if(!s||s.done)return;s.done=true;
 const res=s.qs.map((q,i)=>({q,a:s.ans[i],ok:isOk(q,s.ans[i])}));res.forEach(r=>rec(r.q,r.ok));
 const M=EXMODES[s.mode],N=s.qs.length,r=res.filter(x=>x.ok).length,f=N-r,zf={};M.zero.forEach(t=>zf[t]=res.filter(x=>x.q.topic===t&&!x.ok).length);
 const pf=(M.parts||[]).map(p=>res.filter(x=>p.topics.includes(x.q.topic)&&!x.ok).length);
 const zeroOk=Object.values(zf).every(v=>v===0)&&(M.parts||[]).every((p,i)=>pf[i]<=p.max),pass=f<=M.max&&zeroOk,used=Math.round((Date.now()-(s.t0||Date.now()))/60000);
 history.push({t:Date.now(),r,f,n:N,mode:s.mode,pass});save();

 app.innerHTML=`<div class="panel" style="text-align:center"><div class="big" style="color:${pass?'var(--ok)':'var(--bad)'}">${pass?'BESTÅET':'IKKE BESTÅET'}</div>

 ${M.parts?M.parts.map((p,i)=>`${pf[i]<=p.max?'✅':'❌'} ${p.navn}: <b>${pf[i]}</b> fejl (max ${p.max})`).join('<br>')+'<br>':`${f<=M.max?'✅':'❌'} Fejl i alt: <b>${f}</b> (max ${M.max})<br>`}
 ${M.zero.map(t=>`${zf[t]===0?'✅':'❌'} Fejl i ${TOPICS[t].navn.toLowerCase()}: <b>${zf[t]}</b> (max 0)`).join('<br>')}</div><br>
 <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" id="again">Ny prøve</button><button class="btn ghost" id="trainweak">Træn mine fejl-emner</button></div></div>
 <div class="panel"><h3 style="margin-top:0">Resultat pr. emne</h3><table>${Object.entries(byT).map(([t,v])=>{const p=Math.round(v.r/v.n*100);return`<tr><td>${TOPICS[t].ikon} ${TOPICS[t].navn}</td><td>${v.r}/${v.n}</td><td style="width:40%"><div class="bar"><i style="width:${p}%;background:${p>=80?'var(--ok)':p>=60?'var(--accent)':'var(--bad)'}"></i></div></td></tr>`}).join('')}</table></div>

 const draw=()=>{const only=$('#onlyWrong').checked;$('#rev').innerHTML=res.map((x,i)=>({x,i})).filter(o=>!only||!o.x.ok).map(({x,i})=>`<div class="review" style="padding:12px 0;border-bottom:1px solid var(--line)">
  ${x.q.bk&&!x.q.night?buoy(x.q.bk,{w:70}):x.q.topic==='vig'&&x.q.img?x.q.img.replace('width="240"','width="120"'):''}

  ${x.ok?`<span style="color:var(--ok)">✔ ${ansTxt(x.q,x.q.ans)}</span>`:`<span style="color:var(--bad)">✘ Dit svar: ${ansTxt(x.q,x.a)}</span><br><span style="color:var(--ok)">✔ Rigtigt: ${ansTxt(x.q,x.q.ans)}</span>`}

}

function train(){
 if(!trainTopic){app.innerHTML=`<h2 style="margin-top:0">🎯 Emnetræning</h2><p class="small">Du får svar og forklaring med det samme efter hvert spørgsmål.</p><div class="topics">
  <button class="topic" data-t="svag" style="border-color:var(--accent)"><b>⚡ Mine svage punkter</b><span>Blander emner – flest fra dem, du fejler i</span></button><button class="topic" data-t="kurs" style="border-color:#b45309"><b>📘 Kun kursets spørgsmål</b><span>${STATIC.filter(b=>b[4]==='K').length} spørgsmål fra dine Watergames-quizzer og testeksamen</span></button>
  ${Object.entries(TOPICS).map(([k,t])=>{const p=level(k).txt;return`<button class="topic" data-t="${k}"><b>${t.ikon} ${t.navn}</b><span>${t.besk}<br><i>${p}</i></span></button>`}).join('')}</div>`;
  app.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{trainTopic=b.dataset.t;tc={n:0,r:0,streak:0};train()});return}
 const used=new Set();
 const next=()=>{clearRun();let q;if(trainTopic==='kurs'){const kp=STATIC.filter(b=>b[4]==='K'&&!used.has(b[1]));const b=pick(kp.length?kp:STATIC.filter(b=>b[4]==='K'));used.add(b[1]);q=fromBank(b)}else{const t=trainTopic==='svag'?weightedTopic():trainTopic;q=genTopic(t,used)}
  app.innerHTML=`<div class="row"><button class="btn ghost" id="back">← Emner</button><span class="pill">${trainTopic==='svag'?'⚡ Svage punkter':trainTopic==='kurs'?'📘 Kursets spørgsmål':TOPICS[trainTopic].ikon+' '+TOPICS[trainTopic].navn}</span><span class="pill">Rigtige: ${tc.r}/${tc.n} · 🔥 ${tc.streak}</span></div><div class="panel">${qHTML(q)}<div style="text-align:right;margin-top:12px"><button class="btn" id="nx" style="display:none">Næste →</button></div></div>`;
  startNight(q);$('#back').onclick=()=>{clearRun();trainTopic=null;train()};
  const grade=a=>{const ok=isOk(q,a),A=[].concat(a),C=[].concat(q.ans);app.querySelectorAll('.opt').forEach(x=>{const j=+x.dataset.i;x.disabled=true;if(C.includes(j))x.classList.add('ok');else if(A.includes(j))x.classList.add('bad')});
   rec(q,ok);tc.n++;if(ok){tc.r++;tc.streak++}else tc.streak=0;const ck=$('#chk');if(ck)ck.style.display='none';
   const fb=$('#fb');fb.className='fb '+(ok?'ok':'bad');fb.innerHTML=(ok?'✅ <b>Rigtigt!</b> ':'❌ <b>Forkert.</b> Rigtigt svar: <b>'+ansTxt(q,q.ans)+'</b><br>')+(q.e?' '+q.e:'');
   const n=$('#nx');n.style.display='inline-block';n.onclick=next;n.focus()};
  let picked=[];
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(!q.multi)return grade(i);picked=picked.includes(i)?picked.filter(x=>x!==i):[...picked,i];b.classList.toggle('sel',picked.includes(i));b.querySelector('.chk').textContent=picked.includes(i)?'☑':'☐';$('#chk').style.display=picked.length?'inline-block':'none'});

 <li>Kort ≈ 1 sek · lang = 4–6 sek.</li>
 <li><b>Tåge:</b> Motor med fart: 1 lang hvert 2. min · stoppet: 2 lange · sejlskib: lang-kort-kort. Under 12 m: andet effektivt lydsignal.</li>
 <li>Hører du tågesignal forude for tværs: ned i mindste styrefart.</li></ul>
 <h3>💡 Lanterner & dagsignaler</h3><ul><li>Rød over rød = manøvreudygtig (2 sorte kugler) · rød-hvid-rød = begrænset manøvreevne (kugle-rude-kugle) · grøn over hvid = trawler · rød over hvid = andet fiskeri (2 kegler spids mod spids) · sejlskib under sejl: kun sidelanterner + hæk.</li><li>Kodeflag A = dykker nede · N over C = nød.</li><li>Rød bagbord · grøn styrbord (112,5°) · hvid hæk (135°) · hvid top (225°).</li>
 <li>Motorbåd under 12 m: må vise hvidt rundtlys + sidelanterner.</li><li>Ser du kun hvidt hæklys: du er overhalende. Rød + grøn: den kommer lige imod dig.</li><li>For anker: hvidt rundtlys / sort kugle om dagen.</li></ul>
 <h3>🛟 Afmærkning</h3><ul><li><b>For indadgående</b> (ind i danske farvande nordfra, ind i fjorde og havne – pil i søkortet): grøn til styrbord, rød til bagbord.</li><li><b>Kompasafmærkninger:</b> Nordbøjen passeres nord om – nord for nordbøjen! Farver: <b>sort ved den spidse side, gul ved den flade</b>.</li><li>Lys som urskive (3–6–9–12) – men fyrkarakteren er ikke pensum.</li>
 <li>Isoleret fare (fx stor sten): sort/rød, 2 sorte kugler. Midtfarvand: røde/hvide lodrette striber, 1 rød kugle – midten/starten af en sejlrende. Special: gul med X – restriktionsområde. Ny fare: blå/gul, gult +.</li></ul>
 <h3>🆘 Nød</h3><ul><li><b>MAYDAY</b> = overhængende livsfare · <b>PAN PAN</b> = haster · <b>SECURITE</b> = sikkerhedsadvarsel.</li>
 <li>VHF kanal 16 (tale) · DSC kanal 70 (rød knap: MMSI + position) · telefon 112.</li>
 <li>MAYDAY-melding: MAYDAY ×3, her er [navn] ×3 → position, hvad er sket, hjælp, antal personer, OVER.</li>
 <li><b>MOB:</b> Råb, kast krans, én peger, MOB-knap, drej mod den side personen faldt ud, frigear/stop tæt på personen. 1-10-1-reglen. Bjærg vandret.</li>
 <li><b>Brand:</b> Brandtrekant (brændstof, ilt, varme). Benzindampe synker – ventilér før start. Aldrig vand på benzinbrand.</li></ul>
 <h3>⚙️ Båd & motor</h3><ul><li>Dyb V: blød i bølger. Flad bund: hurtig, hård i bølger.</li><li>Kontrolstråle mangler → stop motoren. Motoren dør efter få min → tankudluftning lukket.</li>
 <li>Start i frigear med nødstopline på. Trim ind = stævn ned (planing, modsø). For meget trim ud = delfinspring. Sænk flappen i den side, der hænger.</li>
 <li>Du er ansvarlig for din hækbølge.</li></ul>
 <h3>📘 Fra dit kursus – let at glemme</h3><ul><li><b>300-meter-reglen:</b> inden for 300 m fra kysten kun direkte til/fra land, max 5 knob (ikke plane). Havne typisk 3 knob, fjorde ofte 5 knob.</li><li><b>Brændstof:</b> planlagt forbrug + 50 % om sommeren, + 100 % om vinteren. Eksempel: 30 sm, 12 kn, 10 L/t → 25 L × 1,5 = 37,5 L. Mål forbruget: fyld op, sejl, fyld op igen. Bølger/modvind = langt højere forbrug.</li><li><b>Promille 0,5 · alder 16 år</b> (prøve fra 15) · kun frisk fiskeaffald i havet.</li><li><b>CE:</b> A alle farvande · B åbent farvand (Kattegat) · C kystnært (Øresund) · D beskyttet (fjorde/søer). Max personer = CE, dog højst antal redningsveste.</li><li><b>Obligatorisk:</b> godkendt redningsvest i rigtig størrelse til hver person (ikke krav at have den på). Redningsvest vender en bevidstløs – svømmevest gør ikke.</li><li><b>Nød</b> = rødt blus/raket, orange røg, N over C, MAYDAY, SOS, flammer, uafbrudt horn, hæve/sænke begge arme. <b>Ikke nød</b> = grønt blus, hvid røg/raket, én arm (opmærksomhed).</li><li><b>Hypotermi:</b> varm langsomt op indefra – tæpper, varm drik. Ingen massage, ingen alkohol.</li><li><b>Anker:</b> ca. 5 × dybden, læ, god holdebund, sæt ankeret i bak. <b>MOB:</b> motor ikke i gang/gear inden for 2 bådlængder.</li><li><b>Flag:</b> A = dykker (min. 50 m) · L = stop. <b>Båker:</b> to båker over hinanden = du er i båkelinjen.</li></ul><h3>🗺️ Navigation</h3><ul><li>1 sømil = 1852 m = 1 bueminut på breddeskalaen. Knob = sømil/time.</li><li>Tid = distance / fart (fx 12 sm / 24 kn = 30 min).</li><li>GPS kan svigte – hav backup. Vejr fra DMI i m/s. Kulingsvarsel fra 14 m/s. Pas på fralandsvind.</li></ul>
 <h3>⚓ Manøvrer</h3><ul><li>Anløb og bøje: langsomt, op mod vind/strøm. Ankerline 3–5 × dybden. Spring styrer båden langs kajen og bruges til afgang.</li>
 <li>Knob: pælestik (fast løkke), ottetal (stopknob), dobbelt halvstik (ring/pæl), klampe: rundtørn + krydsslag + halvt slag.</li></ul></div>`;
}

// ================= STATS =================
function statsView(){
 const rowsT=Object.entries(TOPICS).map(([k,t])=>{const L=level(k);return`<tr><td>${t.ikon} ${t.navn}${['vig','afm'].includes(k)?' <span class="small" style="color:#b45309">(0 fejl-krav)</span>':''}</td><td>${L.n}</td><td style="width:50%">${lvlBar(L)}</td></tr>`}).join('');
 const rowsB=BK.map(k=>({k,L:level('b_'+k,5,8)})).sort((a,b)=>(a.L.acc??(a.L.n?95:200))-(b.L.acc??(b.L.n?95:200))).map(x=>`<tr><td>${buoy(x.k,{w:34})}</td><td>${T[x.k].navn}</td><td>${x.L.n}</td><td style="width:45%">${lvlBar(x.L)}</td></tr>`).join('');
 const kt=history.filter(h=>h.mode==='kursus'),last3=kt.slice(-3),passed=history.filter(h=>h.pass??h.f<=6).length;
 const allTopics=Object.keys(TOPICS).every(k=>['ok','mid'].includes(level(k).cls)),zeroT=['vig','afm'].every(k=>level(k).cls==='ok'),three=last3.length===3&&last3.every(h=>h.pass);
 const chk=(ok,t)=>`<div style="padding:4px 0">${ok?'✅':'⬜'} ${t}</div>`;
 app.innerHTML=`<div class="panel"><h2 style="margin-top:0">📊 Er du klar til prøven?</h2>
 ${chk(allTopics,'Alle emner mindst "Næsten" (≥75 % af de seneste 10 svar, mindst 10 svar pr. emne)')}
 ${chk(zeroT,'Vigeregler og afmærkning "Sikker" (≥90 % af de seneste 10) – her må du ikke fejle i kursets test')}
 ${chk(three,`Bestået kursets testeksamen 3 gange i træk (${last3.map(h=>h.pass?'✅':'❌').join(' ')||'ingen endnu'})`)}
 <p style="margin:10px 0 0;font-weight:600">${allTopics&&zeroT&&three?'🎉 Du er klar!':'Ikke helt endnu – fortsæt træningen.'}</p></div>
 <div class="panel"><h3 style="margin-top:0">Prøveeksamener</h3><p style="margin:0">I alt: <b>${history.length}</b> · Bestået: <b>${passed}</b>${history.length?` · Gns. fejl: <b>${(history.reduce((a,h)=>a+h.f,0)/history.length).toFixed(1)}</b>`:''}</p></div>
 <div class="panel"><h3 style="margin-top:0">Emner</h3><p class="small" style="margin-top:0">Vurderingen bygger på dine <b>seneste 10 svar</b> pr. emne og kræver mindst 10 svar – så ét heldigt svar giver ikke 100 %.</p>
 <table><tr><th>Emne</th><th>Svar i alt</th><th>Niveau</th></tr>${rowsT}</table></div>
 <div class="panel"><h3 style="margin-top:0">Bøjer (svageste øverst)</h3><p class="small" style="margin-top:0">Pr. bøje: seneste 8 svar, mindst 5 svar før vurdering.</p><table>${rowsB}</table></div>
 <div style="display:flex;gap:8px"><button class="btn" id="drill">⚡ Træn svage punkter</button><button class="btn ghost" id="reset">Nulstil statistik</button></div>
 <p class="small">Gemmes kun i denne browser.</p>`;
 $('#drill').onclick=()=>{trainTopic='svag';tc={n:0,r:0,streak:0};go('train')};
 $('#reset').onclick=()=>modal('Nulstil statistik?','Alle dine resultater slettes.',[['Annullér',()=>{}],['Nulstil',()=>{stats={};history=[];save();statsView()},'warn']]);
}
// ================= FLASHCARDS =================
function buildCards(){
 const cards=[];const add=(q,extra='')=>cards.push({...q,ans:[].concat(q.ans),extra});
 for(const k of BK){const t=T[k];add(mk('afm','Hvad er dette, og hvordan skal den passeres?',t.navn,others(k,3).map(x=>T[x].navn),'',{img:buoy(k,{w:130})}),`<b>Passage:</b> ${t.pass}<br><b>Farve:</b> ${t.farve} · <b>Top:</b> ${t.topTxt}<br>💡 ${t.huske}`)}
 for(const k of BK.filter(x=>!x.startsWith('praef')))add(mk('afm','Skroget er skjult – hvilken afmærkning har denne topbetegnelse?',T[k].navn,others(k,3,BK.filter(x=>!x.startsWith('praef'))).map(x=>T[x].navn),T[k].topTxt,{img:buoy(k,{w:130,grey:true})}));
 for(const [h,k] of [['N','oest'],['N','vest'],['S','oest'],['S','vest'],['E','nord'],['E','syd'],['W','nord'],['W','syd']])add(compassQ(h,k));
 VIG.forEach(f=>{const sc=f();add(mk('vig',sc.q||'Hvad gælder i denne situation? (Blå båd = dig)',sc.a,[VA,VB,VC,VD].filter(x=>x!==sc.a),sc.e,{img:scene(sc.o)}))});
 NIGHT.forEach(n=>add(mk('svr','Det er nat, og du ser disse lys forude. Hvad ser du?',n.a,shuf(NIGHT.filter(x=>x!==n).map(x=>x.a)).slice(0,3),n.e,{img:nightScene(n.L)})));
 const seen=new Set();for(const b of STATIC){if(seen.has(b[1]))continue;seen.add(b[1]);add(fromBank(b))}
 return cards;
}
let fcState=null;let fcKnown={};try{fcKnown=JSON.parse(localStorage.getItem('sbfc')||'{}')}catch(e){}
const fcKey=c=>c.topic+'|'+c.q.replace(/<[^>]+>/g,'')+'|'+(c.img?c.img.length:0)+'|'+c.opts.slice().sort().join('/').length;
function fcSave(){try{localStorage.setItem('sbfc',JSON.stringify(fcKnown))}catch(e){}}
function flash(){
 if(fcState&&fcState.deck.length)return fcRender();
 const all=buildCards();
 const sets=[
  ['eks','⭐ Eksamensudgave','Alle bøjer + vigeregler + kursets egne spørgsmål',c=>c.topic==='afm'||c.topic==='vig'||c.kurs],
  ['zero','🛟🧭 Kun bøjer og vigeregler','De to emner, du ikke må fejle i',c=>c.topic==='afm'||c.topic==='vig'],
  ['weak','🔁 Mine "øv igen"-kort','Kort, du har markeret som "øv igen"',c=>fcKnown[fcKey(c)]===0],
  ['all','🃏 Alle kort','Hele bunken',c=>true],
  ...Object.entries(TOPICS).map(([k,t])=>[k,t.ikon+' '+t.navn,'',c=>c.topic===k])];
 app.innerHTML=`<h2 style="margin-top:0">🃏 Flashcards</h2><p class="small">Tryk på kortet for at vende det. Marker "Kunne den" eller "Øv igen" – kort du ikke kunne, kommer igen senere i bunken.</p><div class="topics">
 ${sets.map(([k,n,d,f])=>{const cs=all.filter(f);const kn=cs.filter(c=>fcKnown[fcKey(c)]===1).length;return `<button class="topic" data-s="${k}" ${k==='eks'?'style="border-color:var(--accent)"':''} ${cs.length?'':'disabled style="opacity:.5"'}><b>${n}</b><span>${d?d+'<br>':''}${cs.length} kort${cs.length?` · ${kn} kan du`:''}</span></button>`}).join('')}</div>
 <p class="small" style="margin-top:14px"><button class="btn ghost" id="fcreset">Nulstil "kan/øv igen"</button></p>`;
 app.querySelectorAll('.topic[data-s]').forEach(b=>b.onclick=()=>{const st=sets.find(x=>x[0]===b.dataset.s);const deck=shuf(all.filter(st[3]));if(!deck.length)return;fcState={name:st[1],deck,i:0,done:0,total:deck.length,known:0};fcRender()});
 $('#fcreset').onclick=()=>modal('Nulstil flashcards?','Alle markeringer "kunne / øv igen" slettes.',[['Annullér',()=>{}],['Nulstil',()=>{fcKnown={};fcSave();flash()},'warn']]);
}
function fcRender(){
 const s=fcState;if(!s.deck.length){app.innerHTML=`<div class="panel" style="text-align:center"><div class="big" style="color:var(--ok)">🎉 Færdig!</div><p>Du har været hele bunken igennem: <b>${s.known}</b> af ${s.total} kunne du i første forsøg.</p><button class="btn" id="fcback">Vælg ny bunke</button></div>`;$('#fcback').onclick=()=>{fcState=null;flash()};return}
 const c=s.deck[0];const L=i=>c.multi?'☑':String.fromCharCode(65+i)+'.';
 app.innerHTML=`<div class="row"><button class="btn ghost" id="fcx">← Bunker</button><span class="pill">${s.name}</span><span class="pill">${s.done}/${s.total} · ${s.deck.length} tilbage</span></div>
 <div class="bar" style="max-width:640px;margin:0 auto 12px"><i style="width:${s.done/s.total*100}%;background:var(--sea)"></i></div>
 <div class="fc-wrap"><div class="fc" id="fc">
  <div class="fc-face"><div class="small" style="margin-bottom:6px">${TOPICS[c.topic].ikon} ${TOPICS[c.topic].navn}${c.kurs?' · <b style="color:#b45309">📘 Kursus</b>':''}</div>${c.img?`<div class="fc-img">${c.img}</div>`:''}<p class="qtext">${c.q}</p>${c.multi?'<div class="small" style="color:#b45309;font-weight:700">☑ Vælg gerne flere</div>':''}${c.opts.map((o,i)=>`<div class="fc-o">${c.multi?'☐':String.fromCharCode(65+i)+'.'} ${o}</div>`).join('')}<div class="fc-hint">Tryk for at se svaret</div></div>
  <div class="fc-face fc-back"><div class="small">Svar</div><div class="fc-ans">${c.ans.map(i=>`<span>${L(i)} ${c.opts[i]}</span>`).join('')}</div>${c.e?`<div style="font-size:14px;line-height:1.5">${c.e}</div>`:''}${c.extra?`<div style="font-size:14px;line-height:1.5;margin-top:8px">${c.extra}</div>`:''}</div>
 </div></div>
 <div class="fc-btns"><button class="btn warn" id="fcno">🔁 Øv igen</button><button class="btn" id="fcyes" style="background:var(--ok)">✅ Kunne den</button></div>`;
 const fc=$('#fc');const fit=()=>{const f=fc.querySelectorAll('.fc-face');fc.style.minHeight=Math.max(380,...[...f].map(x=>x.scrollHeight))+'px'};fit();
 fc.onclick=()=>fc.classList.toggle('flip');
 $('#fcx').onclick=()=>{fcState=null;flash()};
 $('#fcyes').onclick=()=>{fcKnown[fcKey(c)]=1;fcSave();if(!c._again)s.known++;s.deck.shift();s.done++;fcRender()};
 $('#fcno').onclick=()=>{fcKnown[fcKey(c)]=0;fcSave();c._again=true;s.deck.shift();s.deck.splice(Math.min(s.deck.length,4+Math.floor(Math.random()*4)),0,c);fcRender()};
}

home();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
